name: Build Chatmail Image

on:
  push:
    branches: [main]
    paths:
      - 'chatmail/**'
      - '.github/workflows/build-chatmail.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push chatmail image
        uses: docker/build-push-action@v6
        with:
          context: ./chatmail
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chatmail-relay:latest
            ghcr.io/${{ github.repository_owner }}/chatmail-relay:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
