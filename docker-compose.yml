# =============================================================================
# Simorgh AI VPS - Docker Compose
# =============================================================================
# Services:
#   - nginx-proxy:   TLS termination, reverse proxy to EKC products & landing
#   - landing-site:  React/Vite marketing website
#   - chatbot-api:   Anthropic-powered product assistant
#   - chatmail:      Privacy-focused email relay (Delta Chat)
#
# Usage:
#   cp .env.example .env && docker compose up -d
# =============================================================================

services:
  # ===========================================================================
  # NGINX PROXY - Main entry point, TLS termination & reverse proxy
  # ===========================================================================
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./scripts/nginx-reload-watcher.sh:/usr/local/bin/nginx-reload-watcher.sh:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
      - ./delta-chat:/usr/share/nginx/downloads:ro
      - /opt/simorgh-articles:/usr/share/nginx/articles:ro
      - nginx_logs:/var/log/nginx
    environment:
      # ${DOMAIN} is the only variable substituted into the nginx template;
      # all other $vars in the config (e.g. $host) are left untouched.
      - DOMAIN=${DOMAIN}
      - NGINX_ENVSUBST_FILTER=^DOMAIN$$
    # Run the cert-reload watcher in the background so renewals are picked up
    # without restarting nginx. The image's docker-entrypoint still processes
    # /etc/nginx/templates before this command runs.
    command: ["/bin/sh", "-c", "/usr/local/bin/nginx-reload-watcher.sh & exec nginx -g 'daemon off;'"]
    networks:
      - frontend_net
    depends_on:
      certbot:
        condition: service_healthy
      landing-site:
        condition: service_healthy
      chatbot-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================================================
  # LANDING SITE - Simorgh AI marketing website (React/Vite)
  # ===========================================================================
  landing-site:
    build:
      context: ./landing-site
      dockerfile: Dockerfile
    image: simorgh-landing:latest
    container_name: landing-site
    expose:
      - "80"
    volumes:
      - /opt/simorgh-articles:/usr/share/nginx/articles:ro
    networks:
      - frontend_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ===========================================================================
  # CHATBOT API - Anthropic Claude proxy with product context
  # ===========================================================================
  chatbot-api:
    build:
      context: ./chatbot-api
      dockerfile: Dockerfile
    image: simorgh-chatbot-api:latest
    container_name: chatbot-api
    expose:
      - "3001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - PORT=3001
    networks:
      - frontend_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================================================
  # CERTBOT - Let's Encrypt: bootstrap + initial issuance + auto-renewal
  # ===========================================================================
  # Single long-running service that:
  #   1. Drops a 1-day self-signed cert at live/${DOMAIN} so nginx can boot.
  #   2. Becomes "healthy" -> nginx-proxy starts and serves /.well-known/...
  #   3. Requests the real Let's Encrypt cert via HTTP-01 webroot challenge.
  #   4. Loops every 12h on `certbot renew`. nginx-proxy's reload watcher
  #      picks up the new fullchain.pem mtime and reloads automatically.
  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
      - ./scripts/certbot-entrypoint.sh:/usr/local/bin/certbot-entrypoint.sh:ro
    environment:
      - DOMAIN=${DOMAIN}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL}
    entrypoint: ["/bin/sh", "/usr/local/bin/certbot-entrypoint.sh"]
    restart: unless-stopped
    networks:
      - frontend_net
    healthcheck:
      # Healthy as soon as the bootstrap cert is in place, which unblocks nginx.
      test: ["CMD-SHELL", "test -f /var/www/certbot/.certbot-ready"]
      interval: 3s
      timeout: 2s
      retries: 60
      start_period: 5s

  # ===========================================================================
  # CHATMAIL RELAY - Privacy-focused messaging (Delta Chat compatible)
  # ===========================================================================
  chatmail:
    image: ghcr.io/shahram-tabasi/chatmail-relay:latest
    container_name: chatmail
    privileged: true
    restart: unless-stopped
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "143:143"
      - "993:993"
      - "3478:3478"
    volumes:
      - chatmail_var:/var
      - chatmail_home:/home
      - chatmail_opt:/opt
      - chatmail_etc:/etc
      - chatmail_root:/root
      - chatmail_usr:/usr
    tmpfs:
      - /run
    networks:
      - chatmail_net

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  frontend_net:
    driver: bridge
  chatmail_net:
    driver: bridge

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  nginx_logs:
  certbot_certs:
  certbot_webroot:
  chatmail_var:
  chatmail_home:
  chatmail_opt:
  chatmail_etc:
  chatmail_root:
  chatmail_usr:
