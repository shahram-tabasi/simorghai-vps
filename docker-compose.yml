services:
  # ============================================================
  # Simorgh Landing Page (React/Vite)
  # Served at: simorghai.com (root domain)
  # ============================================================
  simorgh-site:
    build:
      context: ../simorgh-site
    image: simorgh-site:latest
    container_name: simorgh-site
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - frontend

  # ============================================================
  # Chatmail Relay (Delta Chat)
  # Served at: chat.simorghai.com
  # Requires privileged mode for systemd
  # ============================================================
  chatmail:
    build:
      context: ../chatmail-relay-docker
    image: chatmail-relay:latest
    container_name: chatmail
    privileged: true
    restart: unless-stopped
    expose:
      - "80"
      - "443"
      - "25"
      - "143"
      - "465"
      - "587"
      - "993"
      - "3340"
      - "3478"
    # Mail ports need to be exposed directly (not through nginx)
    ports:
      - "25:25"       # SMTP
      - "143:143"     # IMAP
      - "465:465"     # SMTPS
      - "587:587"     # Submission
      - "993:993"     # IMAPS
      - "3340:3340"   # iroh-relay
      - "3478:3478"   # TURN/STUN
    volumes:
      - chatmail_var:/var
      - chatmail_home:/home
      - chatmail_opt:/opt
      - chatmail_etc:/etc
      - chatmail_root:/root
      - chatmail_usr:/usr
    tmpfs:
      - /run
    networks:
      - frontend

  # ============================================================
  # Nginx Reverse Proxy
  # Routes traffic based on domain:
  #   simorghai.com -> simorgh-site
  #   chat.simorghai.com -> chatmail (port 80/443)
  # ============================================================
  nginx-proxy:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_var:/var/lib/letsencrypt
      - certbot_webroot:/var/www/certbot:ro
    depends_on:
      - simorgh-site
      - chatmail
    networks:
      - frontend

  # ============================================================
  # Certbot for TLS certificates
  # ============================================================
  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - frontend

volumes:
  chatmail_var:
  chatmail_home:
  chatmail_opt:
  chatmail_etc:
  chatmail_root:
  chatmail_usr:
  certbot_etc:
  certbot_var:
  certbot_webroot:

networks:
  frontend:
    driver: bridge
