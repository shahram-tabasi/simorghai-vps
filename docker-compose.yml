# =============================================================================
# Simorgh AI VPS - Docker Compose
# =============================================================================
# Services:
#   - nginx-proxy:       TLS termination, reverse proxy. Built from
#                        nginx/Dockerfile (nginx:alpine + inotify-tools).
#   - landing-site:      React/Vite marketing website
#   - chatbot-api:       Anthropic-powered product assistant
#   - certbot-bootstrap: one-shot, drops a self-signed cert so nginx can boot
#   - certbot-init:      one-shot, requests the real LE cert via webroot
#   - certbot-renew:     long-running, 12h renewal loop (auto-retries issuance
#                        if the initial attempt failed)
#   - blog-api:          Bilingual SEO blog (SSR) + admin panel + SQLite
#
# Usage:
#   cp .env.example .env && docker compose up -d
# =============================================================================

services:
  # ===========================================================================
  # CERTBOT BOOTSTRAP - one-shot, runs before nginx.
  # ===========================================================================
  # Creates a 1-day self-signed cert at live/${DOMAIN}/ if no cert exists yet.
  # Lets nginx-proxy's HTTPS server block start; certbot-init will replace it
  # with a real Let's Encrypt cert as soon as nginx is healthy.
  certbot-bootstrap:
    image: certbot/certbot:latest
    container_name: certbot-bootstrap
    volumes:
      - certbot_certs:/etc/letsencrypt
      - ./scripts/certbot-bootstrap.sh:/usr/local/bin/certbot-bootstrap.sh:ro
    environment:
      - DOMAIN=${DOMAIN}
    entrypoint: ["/bin/sh", "/usr/local/bin/certbot-bootstrap.sh"]
    networks:
      - frontend_net
    restart: "no"

  # ===========================================================================
  # NGINX PROXY - Main entry point, TLS termination & reverse proxy
  # ===========================================================================
  nginx-proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: simorgh-nginx:latest
    container_name: nginx-proxy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./scripts/nginx-reload-watcher.sh:/usr/local/bin/nginx-reload-watcher.sh:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
      - /opt/simorgh-articles:/usr/share/nginx/articles:ro
      - nginx_logs:/var/log/nginx
    environment:
      # ${DOMAIN} is the only variable substituted into the nginx template;
      # all other $vars in the config (e.g. $host) are left untouched.
      - DOMAIN=${DOMAIN}
      - NGINX_ENVSUBST_FILTER=^DOMAIN$$
    # The stock nginx entrypoint only runs its /docker-entrypoint.d init scripts
    # (incl. envsubst-on-templates, which renders templates/*.template into
    # conf.d with ${DOMAIN} substituted) when the command starts with "nginx".
    # Since we override the command, we must run the template step ourselves
    # first, otherwise nginx falls back to the stock default.conf and /health
    # 404s. Then start the inotify-based cert-reload watcher in the background
    # so renewals take effect immediately, and exec nginx in the foreground.
    command: ["/bin/sh", "-c", "/docker-entrypoint.d/20-envsubst-on-templates.sh; /usr/local/bin/nginx-reload-watcher.sh & exec nginx -g 'daemon off;'"]
    networks:
      - frontend_net
    depends_on:
      certbot-bootstrap:
        condition: service_completed_successfully
      landing-site:
        condition: service_healthy
      chatbot-api:
        condition: service_healthy
      blog-api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================================================
  # LANDING SITE - Simorgh AI marketing website (React/Vite)
  # ===========================================================================
  landing-site:
    build:
      context: ./landing-site
      dockerfile: Dockerfile
    image: simorgh-landing:latest
    container_name: landing-site
    expose:
      - "80"
    volumes:
      - /opt/simorgh-articles:/usr/share/nginx/articles:ro
    networks:
      - frontend_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ===========================================================================
  # CHATBOT API - Anthropic Claude proxy with product context
  # ===========================================================================
  chatbot-api:
    build:
      context: ./chatbot-api
      dockerfile: Dockerfile
    image: simorgh-chatbot-api:latest
    container_name: chatbot-api
    expose:
      - "3001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - PORT=3001
    networks:
      - frontend_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===========================================================================
  # CERTBOT INIT - one-shot, runs after nginx-proxy is healthy.
  # ===========================================================================
  # Wipes the dummy cert and requests the real one via the HTTP-01 webroot
  # challenge. Idempotent (skipped via marker file on subsequent ups). Always
  # exits 0 so transient failure doesn't break the compose chain;
  # certbot-renew handles retries.
  certbot-init:
    image: certbot/certbot:latest
    container_name: certbot-init
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
      - ./scripts/certbot-init.sh:/usr/local/bin/certbot-init.sh:ro
    environment:
      - DOMAIN=${DOMAIN}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL}
    entrypoint: ["/bin/sh", "/usr/local/bin/certbot-init.sh"]
    depends_on:
      nginx-proxy:
        condition: service_healthy
    networks:
      - frontend_net
    restart: "no"

  # ===========================================================================
  # CERTBOT RENEW - long-running, 12h loop.
  # ===========================================================================
  # If a real cert exists, runs `certbot renew` (idempotent). If not, retries
  # the initial issuance — lets the deployment self-heal once DNS / port 80 /
  # firewall are sorted, without operator action. nginx-proxy's inotify
  # watcher reloads nginx instantly on each successful issuance/renewal.
  certbot-renew:
    image: certbot/certbot:latest
    container_name: certbot-renew
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
      - ./scripts/certbot-renew.sh:/usr/local/bin/certbot-renew.sh:ro
    environment:
      - DOMAIN=${DOMAIN}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL}
      - RENEW_INTERVAL=${RENEW_INTERVAL:-12h}
    entrypoint: ["/bin/sh", "/usr/local/bin/certbot-renew.sh"]
    depends_on:
      certbot-init:
        condition: service_completed_successfully
    networks:
      - frontend_net
    restart: unless-stopped

  # ===========================================================================
  # BLOG API - Bilingual (FA/EN) SEO blog with admin panel & SQLite
  # ===========================================================================
  # Server-side rendered blog pages for top-tier SEO, a visual admin panel at
  # /admin, image uploads, an email-capture form, and auto-generated
  # sitemap.xml / robots.txt. Data persists in the blog_data volume.
  blog-api:
    build:
      context: ./blog-api
      dockerfile: Dockerfile
    image: simorgh-blog-api:latest
    container_name: blog-api
    expose:
      - "4000"
    environment:
      - PORT=4000
      - SITE_URL=https://${DOMAIN}
      - ADMIN_USER=${BLOG_ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${BLOG_ADMIN_PASSWORD}
      - SESSION_SECRET=${BLOG_SESSION_SECRET}
      # Optional SMTP for the email-capture feature (leave blank to disable)
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
    volumes:
      - blog_data:/data
    networks:
      - frontend_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  frontend_net:
    driver: bridge

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  nginx_logs:
  certbot_certs:
  certbot_webroot:
  blog_data:
