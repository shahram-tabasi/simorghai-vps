# ============================================================
# Simorgh Landing Page - simorghai.com
# ============================================================
server {
    listen 80;
    server_name simorghai.com www.simorghai.com;

    # ACME challenge for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS (uncomment after obtaining certificates)
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    # Serve directly via HTTP (comment out after enabling HTTPS)
    location / {
        proxy_pass http://simorgh-site:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

