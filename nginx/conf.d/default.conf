# =============================================================================
# Simorgh AI VPS - Nginx Configuration
# =============================================================================
# Routing:
#   /               -> Landing Site (static React app)
#   /api/chat       -> Chatbot API (Anthropic proxy)
#   /downloads/*    -> Delta Chat pre-downloaded binaries
#   /chatbot/*      -> Reverse proxy to simorghai.electrokavir.com/chatbot
#   /eplanix/*      -> Reverse proxy to simorghai.electrokavir.com/eplanix
#   /simorgh-draft/*-> Reverse proxy to simorghai.electrokavir.com/simorgh-draft
# =============================================================================

upstream landing {
    server landing-site:80;
    keepalive 16;
}

upstream chatbot_api {
    server chatbot-api:3001;
    keepalive 8;
}

# =============================================================================
# HTTP Server
# =============================================================================
server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # -----------------------------------------------------------------
    # Health check
    # -----------------------------------------------------------------
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # -----------------------------------------------------------------
    # Chatbot API (Anthropic proxy)
    # -----------------------------------------------------------------
    location /api/chat {
        proxy_pass http://chatbot_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # -----------------------------------------------------------------
    # Delta Chat downloads (pre-downloaded binaries)
    # -----------------------------------------------------------------
    location /downloads/ {
        alias /usr/share/nginx/downloads/;
        autoindex off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # -----------------------------------------------------------------
    # REVERSE PROXY: Simorgh AI Chatbot
    # -----------------------------------------------------------------
    location /chatbot/ {
        proxy_pass https://simorghai.electrokavir.com/chatbot/;
        proxy_set_header Host simorghai.electrokavir.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        add_header X-Accel-Buffering "no" always;

        proxy_connect_timeout 300s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;

        proxy_ssl_server_name on;
        proxy_ssl_verify off;

        client_max_body_size 100M;
    }

    # Chatbot API endpoints (via reverse proxy)
    location /chatbot/api/ {
        proxy_pass https://simorghai.electrokavir.com/chatbot/api/;
        proxy_set_header Host simorghai.electrokavir.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection '';

        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        add_header X-Accel-Buffering "no" always;

        proxy_connect_timeout 300s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;

        proxy_ssl_server_name on;
        proxy_ssl_verify off;

        client_max_body_size 100M;
    }

    # -----------------------------------------------------------------
    # REVERSE PROXY: EPLANIX
    # -----------------------------------------------------------------
    location /eplanix/ {
        proxy_pass https://simorghai.electrokavir.com/eplanix/;
        proxy_set_header Host simorghai.electrokavir.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_cache off;

        proxy_connect_timeout 300s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    # -----------------------------------------------------------------
    # REVERSE PROXY: Simorgh Design Suite (simorgh-draft)
    # -----------------------------------------------------------------
    location /simorgh-draft/ {
        proxy_pass https://simorghai.electrokavir.com/simorgh-draft/;
        proxy_set_header Host simorghai.electrokavir.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_cache off;

        proxy_connect_timeout 300s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_ssl_server_name on;
        proxy_ssl_verify off;
    }

    # -----------------------------------------------------------------
    # Landing Site (default - must be last)
    # -----------------------------------------------------------------
    location / {
        proxy_pass http://landing;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_valid 200 1h;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

