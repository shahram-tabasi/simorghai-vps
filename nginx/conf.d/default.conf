# ============================================================
# Chatmail - chat.simorghai.com
# Note: chatmail manages its own TLS via acmetool internally.
# The nginx proxy forwards HTTP traffic for ACME challenges
# and the chatmail web interface.
# Mail ports (25, 143, 465, 587, 993) are exposed directly
# on the host, not through this nginx proxy.
# ============================================================
server {
    listen 80;
    server_name chat.simorghai.com;

    # Forward everything to chatmail container's internal nginx
    location / {
        proxy_pass http://chatmail:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Default server - catch-all for unknown hosts
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 444;
    }
}
